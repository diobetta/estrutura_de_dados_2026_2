<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta.me</title>
  <link rel="icon" href="./assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="header">
    <div class="container header-container">
      <a class="brand" href="./index.html">
        <img src="./assets/logo-icone.png" alt="" width="113" height="96">
        <span>Consulta<strong>.me</strong></span>
      </a>

      <div class="header-actions">
        <a href="./login/login.html" class="btn btn-primary">Entrar</a>
      </div>
    </div>
  </header>

  <main class="hero">
    <div class="container hero-container">
      <div class="hero-content">
        <span class="hero-eyebrow">Consulta.me</span>
        <h1 class="hero-title">Encontre profissionais de <span>diversas especialidades</span></h1>
        <p class="hero-subtitle">e agende sua consulta com facilidade</p>

        <div class="hero-actions">
          <a href="./login/login.html" class="btn btn-light btn-lg">Agendar consulta</a>
        </div>
      </div>

      <div class="hero-image">
        <img src="./assets/medico.webp" alt="Médico com máscara" width="802" height="1111">
        <img src="./assets/medica.webp" alt="Médica com estetoscópio" width="740" height="988">
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <img src="./assets/logo-aluno.svg" alt="Logo Aluno" width="203" height="64">
      <p>2025 © Desenvolvido por Aluno | Projeto fictício sem fins comerciais.</p>
    </div>
  </footer>
</body>

</html>
