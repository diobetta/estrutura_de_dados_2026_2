<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento de consulta · Consulta.me</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <header class="header">
    <div class="container header-container">
      <a class="brand" href="../login/index_logado.html">
        <img src="../assets/logo-icone.png" alt="" width="113" height="96">
        <span>Consulta<strong>.me</strong></span>
      </a>

      <nav class="nav" aria-label="Principal">
        <a href="../medico/listagem_medico.html" class="nav-link">Médicos</a>
        <a href="./listagem_consulta.html" class="nav-link" aria-current="page">Consultas</a>
      </nav>

      <details class="user-menu">
        <summary><span class="avatar">W</span><span class="user-menu-name">Olá, William</span></summary>
        <div class="user-menu-list">
          <a href="../index.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            Sair
          </a>
        </div>
      </details>
    </div>
  </header>

  <main class="container page">
    <section class="card form-card">
      <div class="page-header">
        <div>
          <h1 class="page-title">Agendamento de consulta</h1>
          <p class="page-subtitle">Escolha a especialidade, o médico e o melhor horário.</p>
        </div>
      </div>

      <form method="post" action="#">
        <input type="hidden" name="id">

        <div class="form-grid">
          <div class="form-group">
            <label for="especialidade">Especialidade</label>
            <select id="especialidade" name="especialidade" required>
              <option value="" disabled selected>Selecione uma especialidade</option>
              <option>ORTOPEDIA</option>
            </select>
          </div>

          <div class="form-group">
            <label for="idMedico">Médico</label>
            <select id="idMedico" name="idMedico" required>
              <option value="" disabled selected>Selecione um médico</option>
            </select>
          </div>

          <div class="form-group">
            <label for="cpf">CPF do paciente</label>
            <input id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required>
          </div>

          <div class="form-group">
            <label for="data">Data e hora</label>
            <input id="data" name="data" type="datetime-local" required>
          </div>
        </div>

        <div class="form-actions">
          <a href="./listagem_consulta.html" class="btn btn-secondary">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Voltar
          </a>

          <button type="submit" class="btn btn-primary">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Agendar
          </button>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <img src="../assets/logo-aluno.svg" alt="Logo Aluno" width="203" height="64">
      <p>2025 © Desenvolvido por Aluno | Projeto fictício sem fins comerciais.</p>
    </div>
  </footer>
</body>

</html>
