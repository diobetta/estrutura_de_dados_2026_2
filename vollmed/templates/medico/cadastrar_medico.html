<!DOCTYPE html>
<html lang="pt-br">

<head>{% include "global/_head.html" %}</head>

<body>
  <header class="header">
    <div class="container header-container">
      <a class="brand" href="../login/index_logado.html">
        <img src="../assets/logo-icone.png" alt="" width="113" height="96">
        <span>Consulta<strong>.me</strong></span>
      </a>

      <nav class="nav" aria-label="Principal">
        <a href="./listagem_medico.html" class="nav-link" aria-current="page">Médicos</a>
        <a href="../consulta/listagem_consulta.html" class="nav-link">Consultas</a>
      </nav>

      <details class="user-menu">
        <summary><span class="avatar">W</span><span class="user-menu-name">Olá, William</span></summary>
        <div class="user-menu-list">
          <a href="../index.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            Sair
          </a>
        </div>
      </details>
    </div>
  </header>

  <main class="container page">
    <section class="card form-card">
      <div class="page-header">
        <div>
          <h1 class="page-title">Cadastro de médico</h1>
          <p class="page-subtitle">Preencha os dados abaixo para cadastrar um novo médico.</p>
        </div>
      </div>

      <form method="post" action="#">
        <input type="hidden" name="id">

        <div class="form-grid">
          <div class="form-group form-group-full">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" placeholder="Nome completo" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="medico@email.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" placeholder="(00) 00000-0000" autocomplete="tel" required>
          </div>

          <div class="form-group">
            <label for="crm">CRM</label>
            <input id="crm" name="crm" inputmode="numeric" placeholder="000000" required>
          </div>

          <div class="form-group">
            <label for="especialidade">Especialidade</label>
            <select id="especialidade" name="especialidade" required>
              <option value="" disabled selected>Selecione uma especialidade</option>
              <option>ORTOPEDIA</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <a href="./listagem_medico.html" class="btn btn-secondary">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Voltar
          </a>

          <button type="submit" class="btn btn-primary">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Cadastrar
          </button>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">{% include "global/_footer.html" %}</footer>
</body>

</html>
